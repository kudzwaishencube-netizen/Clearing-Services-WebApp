<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="anchorOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7B29"/>
      <stop offset="100%" stop-color="#F37021"/>
    </linearGradient>
  </defs>
  <!-- Rounded Brand Orange Base for perfect visibility in both light & dark browser tabs -->
  <rect width="64" height="64" rx="14" fill="url(#anchorOrange)"/>
  
  <!-- Anchor Logo Symbol -->
  <g fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Ring / Eye -->
    <circle cx="32" cy="16" r="5.5"/>
    
    <!-- Stock (Horizontal Bar) -->
    <line x1="20" y1="27" x2="44" y2="27"/>
    
    <!-- Shank (Vertical Stem) -->
    <line x1="32" y1="21.5" x2="32" y2="52"/>
    
    <!-- Lower Curved Arms & Flukes -->
    <path d="M15 36 c 0 9.5 7.5 16 17 16 s 17 -6.5 17 -16"/>
    
    <!-- Left Arrow Palm -->
    <path d="M11 38 l 4 -2 l 3 4"/>
    
    <!-- Right Arrow Palm -->
    <path d="M53 38 l -4 -2 l -3 4"/>
  </g>
</svg>
